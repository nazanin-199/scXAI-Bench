[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scxai-bench"
version = "0.1.0"
description = "A lightweight benchmark framework for explainability evaluation in single-cell machine learning"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

# Phase 1 dependencies. Only numpy is required for the utils module itself;
# the rest are declared here so `pip install -e .` sets up the full Phase 1
# environment as later modules (models, explainers, metrics) are added.
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "torch>=2.0",
    "scanpy>=1.9",
    "anndata>=0.10",
    "captum>=0.7",
    "shap>=0.44",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["scxai_bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
